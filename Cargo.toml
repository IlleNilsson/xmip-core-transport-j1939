[package]
name = "xmip-core-transport-j1939"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-j1939"
description = "J1939 transport: SAE J1939 over CAN — 29-bit identifiers of priority, parameter group and source address, and the transport protocol, BAM and RTS/CTS, for a payload of up to 1785 bytes. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { workspace = true }
# The names what this technology observed of a sender travels under, which
# the identity gates read (`context::property`, ADR-0019 amendment
# 2026-10-06).
context = { workspace = true, optional = true }
# The `0x` number a target names (`codec::hex`).
codec = { workspace = true, optional = true }
# The one refusal of a size over a ceiling (`net::ceiling`).
net = { workspace = true, optional = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
# The carrier, declared in architecture.toml: the bus, the frame and the
# loopback every CAN protocol rides on come from can-bus, never copied.
can_bus = { workspace = true, optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:context", "dep:codec", "dep:net", "dep:can_bus"]
# The declaration alone, with the bounds of J1939-21 and the group, address,
# priority and wait its defaults name.
declaration = []
# A Location's CAN interface opened as the kernel's bus, `can0` and its kind:
# can-bus's SocketCAN on Linux, a simulated bus of that name elsewhere; the
# technology's code, so the default with it.
socketcan = ["default", "can_bus/socketcan"]

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
